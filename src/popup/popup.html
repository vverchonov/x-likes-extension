<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Likes</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="header">
      <img class="mark" src="icons/icon32.png" alt="" width="32" height="32" />
      <h1>Likes</h1>
      <nav class="header-links">
        <a id="x-link" href="https://x.com/your_handle" target="_blank" rel="noreferrer">X</a>
        <a id="site-link" href="https://example.com" target="_blank" rel="noreferrer">Website</a>
      </nav>
    </header>
    <div class="row">
      <div>
        <p class="label">Capture likes</p>
        <p class="hint">Original posts only</p>
      </div>
      <div class="row-actions">
        <button id="refresh" type="button" aria-label="Refresh">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path
              fill="currentColor"
              d="M17.65 6.35A7.96 7.96 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08a5.99 5.99 0 0 1-5.65 4c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4z"
            />
          </svg>
        </button>
        <button id="capture-toggle" type="button" role="switch" aria-checked="true" aria-label="Capture likes">
          <span class="knob"></span>
        </button>
      </div>
    </div>
    <main id="timeline" class="timeline"></main>
    <script src="popup.js"></script>
  </body>
</html>
